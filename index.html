<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Call - Advanced WebRTC Audio & Video Calling PWA</title>
    <meta name="description" content="A highly advanced, modern, and premium WebRTC audio-video calling PWA with high-quality Opus codec and ultra-low latency." />
    <meta property="og:title" content="Global Call - WebRTC PWA" />
    <meta property="og:description" content="A highly advanced, modern, and premium WebRTC audio-video calling PWA with high-quality Opus codec and ultra-low latency." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Global Call" />
    
    <!-- App Icons -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Early PWA Capturing Script -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        if (window.onDeferredPromptReceived) {
          window.onDeferredPromptReceived(e);
        }
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        if (window.onAppInstalled) {
          window.onAppInstalled();
        }
      });

      // Safe sandbox WebSocket mock to prevent Vite HMR connection failures
      if (typeof window !== 'undefined') {
        window.WebSocket = function(url, protocols) {
          let listeners = { open: [], message: [], close: [], error: [] };
          return {
            readyState: 3,
            send: () => {},
            close: () => {},
            addEventListener: function(event, fn) {
              if (listeners[event]) listeners[event].push(fn);
            },
            removeEventListener: function(event, fn) {
              if (listeners[event]) {
                listeners[event] = listeners[event].filter(f => f !== fn);
              }
            },
            dispatchEvent: () => true,
            onopen: null,
            onmessage: null,
            onclose: null,
            onerror: null
          };
        };
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        // Global uncaught HMR / WebSocket error handler
        window.addEventListener('error', (e) => {
          if (e.message && (e.message.toLowerCase().includes('websocket') || e.message.toLowerCase().includes('vite') || e.message.toLowerCase().includes('hmr') || e.message.toLowerCase().includes('closed without opened'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', (e) => {
          if (e.reason && (e.reason.message || String(e.reason)).toLowerCase().includes('websocket') || (e.reason && String(e.reason).toLowerCase().includes('closed without opened'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        const originalConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(arg => String(arg || '')).join(' ').toLowerCase();
          if (msg.includes('websocket') || msg.includes('vite') || msg.includes('hmr') || msg.includes('closed without opened')) {
            return;
          }
          originalConsoleError.apply(console, args);
        };
      }
    </script>
    
    <!-- Preload Google reCAPTCHA API -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-50 antialiased selection:bg-teal-500/30 selection:text-teal-200">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
