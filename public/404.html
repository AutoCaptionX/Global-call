<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Global Call</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages 404 handling
      var l = window.location;
      var repoPrefix = l.pathname.split('/')[1] && l.pathname.split('/')[1].indexOf('.') === -1 ? '/' + l.pathname.split('/')[1] : '';
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPrefix + '/?p=/' +
        l.pathname.replace(repoPrefix, '').slice(1) +
        (l.search ? '&q=' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
